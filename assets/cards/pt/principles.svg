#9ca0a9">Uma ação só termina com uma conferência externa, nunca com o relato do próprio agente.</text><line x1="51" y1="156" x2="51" y2="208" stroke="#9fbcff" stroke-opacity=".25"/><circle cx="51" cy="156" r="9" fill="url(#hfff3dc)"/><circle cx="51" cy="156" r="2.2" fill="#fff"/><text x="72" y="161" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#eef1f6">Revisão adversária entre modelos</text><text x="72" y="180" font-family="Spectral, Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#9ca0a9">Documentos jurídicos e financeiros são atacados por um modelo de outra família.</text><line x1="51" y1="208" x2="51" y2="260" stroke="#9fbcff" stroke-opacity=".25"/><circle cx="51" cy="208" r="9" fill="url(#hfff3dc)"/><circle cx="51" cy="208" r="2.2" fill="#fff"/><text x="72" y="213" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#eef1f6">Aprovação humana no irreversível</text><text x="72" y="232" font-family="Spectral, Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#9ca0a9">Assinar, enviar, publicar e colocar no ar param à espera de aprovação explícita.</text><line x1="51" y1="260" x2="51" y2="312" stroke="#9fbcff" stroke-opacity=".25"/><circle cx="51" cy="260" r="9" fill="url(#hfff3dc)"/><circle cx="51" cy="260" r="2.2" fill="#fff"/><text x="72" y="265" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#eef1f6">Vigias medem progresso</text><text x="72" y="284" font-family="Spectral, Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#9ca0a9">Vigias acompanham se o trabalho avança, avisam quando falham e se encerram sozinhos.</text><circle cx="51" cy="312" r="9" fill="url(#hfff3dc)"/><circle cx="51" cy="312" r="2.2" fill="#fff"/><text x="72" y="317" font-family="Spectral, Georgia, 'Times New Roman', serif" font-size="15.5" fill="#eef1f6">Conhecimento em procedimentos versionados</text><text x="72" y="336" font-family="Spectral, Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#9ca0a9">Regras aprendidas com incidentes viram procedimentos revisados e versionados.</text></svg>